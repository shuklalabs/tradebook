isk per Trade</b> shows a <b>Violations</b> count — trades whose actual risk (Init SL distance × Qty, as a % of capital at entry) exceeded your configured Risk per Trade % — colored green (0–3 violations), amber (4–7), or red (8+, or any single trade risking more than 1 percentage point over your limit) — click <b>Violations: X</b> when it's above zero to see exactly which trades breached the limit. <b>Capital Protection</b> shows <b>Remaining</b> — how much of that protection amount is left after this view's Net P&L, colored green above 50%, amber from 25–50%, red at or below 25% — click <b>Remaining: XX%</b> to see every trade in view, worst P&amp;L first, with a running total showing exactly how each one added to or ate into it. All of these update automatically when you change the FY or Strategy filter.</p>
      <h4>2. Open Trades</h4>
      <p>Your live book — and the only place you should manually type in a new trade. The journal maintains <b>one Open Trade per symbol</b>; if you add a position for a symbol that's already open, it's folded into the existing one as a new entry rather than creating a duplicate. Every position gets a permanent <b>Position ID</b> the moment it's created — shown as a small label under the symbol, formatted like <b>FY2627-0001</b> (financial year + a sequence number for that year). It's assigned once and never changes, no matter how many times you add to or exit the position. Each position also carries a Strategy and a Setup (picked from your configurable lists), plus Init SL, Trail SL and CMP — update CMP and Trail SL as the trade develops and unrealized P&amp;L updates instantly.</p>
      <p>If you've added to a position more than once, a simple entry summary appears below it — one row per entry, oldest first, showing date, price, quantity and Init SL (when set) with Notes if any, and a ✎ right next to the summary to edit that single entry's Entry Date, Entry Price, Quantity, Init SL and Notes. The edit dialog also shows a live INIT SL % (computed from that entry's own Entry Price against its Init SL, or the position's Init SL if the entry doesn't have its own) and, when the position has more than one entry, a Delete button to remove that entry entirely. Editing or deleting an entry recalculates the position's Average Entry Price, Total Quantity and Invested, without changing its Position ID, its <b>POS %</b>, or the rest of its history — a position always keeps at least one entry, so Delete is hidden when only one remains. A position built from a single entry doesn't show this list — edit it directly from the ✎ on its row instead. The <b>Invested</b> column shows the capital currently deployed in each open trade (Entry Price × Qty). <b>POS %</b> is that as a share of your Current Capital, but unlike Invested it isn't live — it's set once when the position is first opened, and only updates again when you add a new entry (scale in) using the total Invested at that moment; it deliberately ignores CMP movement and any capital changes from your other trades, so it always reflects capital actually committed, not a moving target. <b>R-Mult</b> is Net P/L ÷ Initial Risk, calculated live from the position's current unrealized Net P/L for as long as it stays open — once you exit, this becomes the realized R-Mult shown in the Booked Trades.</p>
      <p><b>Add</b> — scale into an existing position. Enter just Entry Date, Entry Price and Added Quantity; nothing else needs re-entering. The position's average entry price and total quantity recalculate automatically (weighted by size), its Position ID stays exactly the same, and a new line appears in the entry summary.</p>
      <p><b>Exit</b> — scale out or close a position. You see the position's details for reference (read-only) and enter Exit Price, Exit Quantity (defaults to the full open quantity) and optional Notes. Quantity is reduced <b>FIFO</b> — oldest entries are exited first, matching how exchanges actually account for it. Exit less than the full quantity and the remainder stays open with its entries updated; exit the full quantity and the position closes and disappears from this tab.</p>
      <p>Either way, a <b>Booked Trades entry is created automatically</b> for exactly the quantity you exited — carrying the same Position ID as the position it came from, with its own realized Net P/L, R-Mult and Hold calculated from the FIFO-matched entry price and date. Its <b>Impact</b> is calculated fresh from your Current Capital at this exact moment, then locked in permanently. You never re-type Symbol, Strategy, Setup or Init SL to close a trade.</p>
      <h4>3. Booked Trades</h4>
      <p>Every closed trade for the selected FY and Strategy — populated automatically as you exit Open Trades, plus anything you log directly here. Filter by Setup or side, search by symbol or Position ID. Click ✎ to edit a trade; Delete lives inside that edit dialog rather than on the row, so a stray tap can't remove a trade by accident. Trades that share a Position ID — every partial exit and the final exit from the same original position — are grouped together and shown in chronological order (with a label like "FY2627-0008 (exit 2/3)"), so you can review a position's whole lifecycle as one block, while the list overall still sorts newest-first. Manually logged trades that didn't come from an Open Trade simply won't have a Position ID. The <b>Hold</b> column is calculated automatically from Entry Date to Exit Date. <b>Impact</b> is always calculated once, at the exact moment a trade closes, as Net P/L ÷ Current Capital at that instant — how much that trade moved your capital. It's then locked in permanently: it never recalculates afterwards, so the Booked Trades stays a true historical record no matter how your account grows or shrinks later. <b>R-Mult</b> (Net P/L ÷ initial risk) needs an Init SL logged on the trade to show anything but "—". <b>P/L %</b> is Net P/L as a percentage of capital deployed on that trade. Both <b>Strategy</b> and <b>Setup</b> are fixed dropdowns (not free text), so they stay consistent across every trade — this is what makes Performance by Setup and the Strategy Filter trustworthy. Trades logged before Strategy existed show as <b>Not Assigned</b>, and trades logged before Impact existed had it reconstructed once automatically from your trade history, then locked in the same way. <b>Followed Plan</b> (Yes/No/Not set, available both in the Add/Edit Trade dialog and when exiting an Open Trade) records whether you actually stuck to your own criteria on that trade — it's stored as a small tag at the start of Notes rather than a separate field, and shows as its own line, <b>Plan: ✅</b> or <b>Plan: ❌</b>, above your manually typed note in the Notes column here.</p>
      
      <h4>4. Money Management</h4>
      <p><b>Position Calculator</b> — at the top of this tab, add a candidate with Entry Price and Stop Loss. Quantity auto-calculates so that a stop-out loses no more than your Risk % of current capital. Use the ↳ button to add the sized candidate directly to Open Trades.</p>
      <p><b>Capital &amp; Risk</b> — shows <b>Current Capital</b> (labeled with a small "Capital Balance + Realized P/L" reference underneath — your ledger's Capital Balance plus this FY's Net P/L), <b>Capital in Use</b> (value tied up in Open Trades — never FY-filtered), <b>Available Capital</b> (Current Capital minus Capital in Use), and your <b>Risk per Trade (%)</b> and <b>Capital Protection (%)</b> settings. Risk % and Capital Protection % can only be edited while viewing the current FY; other Financial Years are read-only.</p>
      <p><b>Capital Transactions</b> — a running ledger for the selected FY: Opening Balance, Deposits, Withdrawals, Adjustments, and the P&amp;L Transfer created when a Financial Year is closed. Each row shows a <b>Dr Amount</b> (money out) or a <b>Cr Amount</b> (money in) — never both — the same convention as a bank passbook. <b>Capital Balance</b> (shown in the section header) is the ledger's own running total; it excludes this FY's not-yet-transferred trade P&amp;L, which is why Current Capital above is Capital Balance + Net P/L (FY). Use <b>+ Add Transaction</b> (bottom-right of the table) to log a Deposit, Withdrawal, or Adjustment — only available for the current FY. Deposit is always Cr and Withdrawal is always Dr (locked automatically); Adjustment is the only type where you choose <b>Amount Type: Cr or Dr</b> yourself, since it's a manual correction that can go either way. Click ✎ on a row to edit or delete it — Deposits, Withdrawals, and Adjustments can be edited any time their FY is still the current one; the Opening Balance can only be edited if it belongs to the very first Financial Year on record and that FY hasn't been closed yet; the P&amp;L Transfer created by Close FY can never be edited, since it has to stay an exact record of what actually happened.</p>
      <p><b>Close FY</b> — available only for the current Financial Year. It calculates that FY's Realized Net P/L, records a P/L Transfer and a new Opening Balance in the ledger, and opens the next Financial Year — all in one step, after two confirmation screens. It cannot be run twice for the same FY.</p>
      <h4>5. Configuration</h4>
      <p><b>Strategies</b> — add, rename, or remove the strategies that appear in the Strategy dropdown across Booked Trades and Open Trades, and in the Dashboard's Strategy Filter. Renaming updates every trade that already uses that strategy; removing one only takes it out of future selection.</p>
      <p><b>Setup</b> — same idea, for setups. Add, rename, or remove entries here and the Setup dropdown everywhere in the app updates automatically.</p>
      <h4>Playbook</h4>
      <p>A fixed reference for how you actually trade each setup, separate from the free-form Notes on individual trades. Pick a <b>Strategy</b> (or leave it as <b>Any Strategy</b> for a general entry) and a <b>Setup</b>, then write <b>Entry Criteria</b> (what has to be true before you take the trade), <b>Exit Criteria</b> (target, stop, invalidation — what tells you to get out), and optional <b>Notes</b>. Strategy and Setup complement each other — the same setup can trade differently depending on the strategy it's used in, so one Setup can have several playbook entries, one per Strategy, alongside a single Any-Strategy entry if you want a general fallback. Each Strategy + Setup combination can only have one entry; trying to add a duplicate points you to the existing one instead. Click <b>Edit</b> on any entry to update it or delete it.</p>
      <h4>Financial Year (FY) &amp; Strategy Filter</h4>
      <p>The FY dropdown (April–March) and the Strategy dropdown sit side by side in the top bar. Together they scope the Dashboard, Booked Trades, Performance by Setup, Monthly Performance, and Money Management. Besides individual years, the FY dropdown also has an <b>All Time</b> option, which shows those same views across every trade you've ever logged, regardless of year — it defaults to the current FY on open, not All Time. In <b>Money Management</b>, All Time is a true lifetime view: Current Capital is live, and Capital Transactions combines every FY's ledger chronologically (each FY's own Opening Balance row is left out there, since it's just a repeat of the balance already carried forward). <b>YTD Return %</b> always reflects the real current FY, even while browsing All Time or a past year — Return % is instead labeled <b>FY Return %</b> for a past year and <b>All Time Return %</b> when that's selected. Open Trades are never FY-filtered — they always show everything currently open. Pick <b>All Strategies</b> to see overall performance, or a specific strategy to see everything filtered to just that one — your underlying data isn't split up, only the view.</p>
      <h4>Export &amp; Import Data</h4>
      <p>Use <b>Export Data</b> in Configuration → Data &amp; Backup to choose a <b>Report Type</b> (Open Trades, Booked Trades, or Capital Transactions) and a <b>Period</b> (Current FY, Previous FY, All Time, or a Custom Range), then download it as an .xlsx file.</p>
      <p><b>Import Trades</b>, in the same place, bulk-imports closed trades from a broker export or another journal (CSV, .xlsx, or .xls). Pick a file — if it has more than one sheet, you'll be asked which one to use — then map its columns to TradeVault's fields (auto-guessed where possible — Symbol, Side, Entry/Exit Date, Entry/Exit Price, and Quantity are required; Init SL, Strategy, Setup, and Notes are optional). Dates should be <b>YYYY-MM-DD</b> or <b>DD-MM-YYYY</b>; other formats may not parse correctly. Side values like Buy/Sell or B/S are recognized automatically. A Strategy or Setup value that doesn't match one of your configured tags is left blank rather than silently creating a new one — add it in Configuration first if you want it recognized, then re-import. Rows that match an existing trade on Symbol + Entry/Exit Date + Entry/Exit Price + Qty are treated as duplicates and skipped by default (with an option to import them anyway, in case it's a genuinely repeated trade). Nothing is written until the final preview step, which shows every row's status and lets you confirm before committing — rows with errors (bad dates, missing prices, etc.) are skipped and listed individually so you can fix and re-import just those.</p>
      <h4>Last Updated</h4>
      <p>The top bar shows a <b>Last Updated</b> timestamp, visible on every tab, that refreshes automatically whenever you add, edit, or delete a trade or open trade, or save changes in Money Management.</p>
      <h4>Data &amp; Backup</h4>
      <p>Everything you enter is saved automatically to a local database file on this computer as you use it, and reloads exactly as you left it next time — no login, no server, nothing shared with anyone else. The journal works fully offline (aside from Excel Export and initial font loading, which need an internet connection).</p>
      <p><b>Configuration → Data &amp; Backup</b> shows exactly where that database file lives on your computer, and is split into two sections. <b>Export &amp; Import Data</b> acts on specific data — <b>Export Data</b> downloads a report and <b>Import Trades</b> bulk-loads trades from a file, both explained above. <b>Backup</b> is different — <b>Export Backup</b> saves a one-off snapshot of the entire app (every trade, position, setting, and Capital Transaction) whenever you want, and <b>Import Backup</b> restores from one, replacing all current data in the app — handy for a manual safety copy, or for moving your journal to a new computer.</p>
    </div>
  </div>`;
}

// ---- Import Trades from CSV ---------------------------------------------------------------
// Broker/other-journal CSVs vary wildly in column names and date formats, so this is a 3-step
// wizard: pick a file, map its columns onto TradeVault's fields (auto-guessed), then validate
// and preview before anything is actually written to state.trades.
let tradeImport = { headers: [], rows: [], mapping: {} };
let dashboardViolatingTrades = [];
let dashboardProtectionTrades = [];

const CSV_FIELD_DEFS = [
  { key:'symbol', label:'Symbol', required:true, aliases:['symbol','ticker','scrip','stock','instrument'] },
  { key:'side', label:'Side', required:true, aliases:['side','type','buy/sell','transaction type','trade type'] },
  { key:'entry', label:'Entry Date', required:true, aliases:['entry date','buy date','entry','trade date','date bought'] },
  { key:'exit', label:'Exit Date', required:true, aliases:['exit date','sell date','exit','date sold'] },
  { key:'entryPrice', label:'Entry Price', required:true, aliases:['entry price','buy price','entry rate','avg buy price'] },
  { key:'exitPrice', label:'Exit Price', required:true, aliases:['exit price','sell price','exit rate','avg sell price'] },
  { key:'qty', label:'Quantity', required:true, aliases:['qty','quantity','shares','units'] },
  { key:'initSL', label:'Init SL', required:false, aliases:['init sl','initial sl','stop loss','sl'] },
  { key:'strategy', label:'Strategy', required:false, aliases:['strategy'] },
  { key:'setup', label:'Setup', required:false, aliases:['setup'] },
  { key:'remarks', label:'Notes', required:false, aliases:['notes','remarks','comment','comments'] }
];

function guessCsvColumn(header, aliases){
  const h = header.trim().toLowerCase();
  return aliases.some(a=>h===a || h.includes(a));
}

function openCsvImportModal(){
  tradeImport = { headers: [], rows: [], mapping: {} };
  const bg = document.getElementById('modalBg');
  document.getElementById('modalBody').innerHTML = `
    <h3>Import Trades</h3>
    <p class="desc">Pick a CSV or Excel file. You'll map columns next — nothing imports until you confirm on the preview.</p>
    <p class="desc" style="margin-top:8px">Dates should be <b>YYYY-MM-DD</b> or <b>DD-MM-YYYY</b>.</p>
    <input type="file" id="csvFileInput" accept=".csv,.xlsx,.xls,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="margin-top:14px;color:var(--text)">
    <div class="modal-actions">
      <button class="btn" id="mCancel">Cancel</button>
    </div>`;
  bg.classList.add('open');
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('csvFileInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(typeof XLSX==='undefined'){ alert('Import library failed to load. Check your internet connection.'); return; }
    const isCsv = /\.csv$/i.test(file.name);
    let wb;
    try{
      if(isCsv){
        const text = await file.text();
        wb = XLSX.read(text, {type:'string'});
      } else {
        const buf = await file.arrayBuffer();
        wb = XLSX.read(buf, {type:'array'});
      }
    } catch(err){ alert('Could not read this file: ' + err.message); return; }
    if(!wb.SheetNames.length){ alert('No sheets found in this file.'); return; }
    tradeImport.wb = wb;
    if(wb.SheetNames.length>1){ renderSheetPickerStep(); }
    else { loadSheetIntoTradeImport(wb.SheetNames[0]); }
  };
}

function renderSheetPickerStep(){
  const bg = document.getElementById('modalBg');
  const wb = tradeImport.wb;
  document.getElementById('modalBody').innerHTML = `
    <h3>Choose a Sheet</h3>
    <p class="desc">This file has ${wb.SheetNames.length} sheets. Pick the one with your trade data.</p>
    <div class="field full" style="margin-top:14px"><label>Sheet</label>
      <select id="sheetPicker">${wb.SheetNames.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
    </div>
    <div class="modal-actions">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mNext">Next</button>
    </div>`;
  bg.classList.add('open');
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mNext').onclick = ()=> loadSheetIntoTradeImport(document.getElementById('sheetPicker').value);
}

function loadSheetIntoTradeImport(sheetName){
  const sheet = tradeImport.wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
  if(!rows.length){ alert(`No rows found in "${sheetName}".`); return; }
  tradeImport.headers = Object.keys(rows[0]);
  tradeImport.rows = rows;
  CSV_FIELD_DEFS.forEach(f=>{
    const match = tradeImport.headers.find(h=>guessCsvColumn(h, f.aliases));
    tradeImport.mapping[f.key] = match || '';
  });
  renderCsvMappingStep();
}

function renderCsvMappingStep(){
  const bg = document.getElementById('modalBg');
  document.getElementById('modalBody').innerHTML = `
    <h3>Map Columns <small style="color:var(--muted);font-weight:400;font-size:12px">${tradeImport.rows.length} rows found</small></h3>
    <p class="desc">Match each field to a column. * fields are required — rows missing them are skipped.</p>
    <div class="form-grid" style="margin-top:14px">
      ${CSV_FIELD_DEFS.map(f=>`
        <div class="field"><label>${f.label}${f.required?' *':''}</label>
          <select data-map="${f.key}">
            <option value="">— none —</option>
            ${tradeImport.headers.map(h=>`<option value="${h}" ${tradeImport.mapping[f.key]===h?'selected':''}>${h}</option>`).join('')}
          </select>
        </div>`).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mNext">Next: Preview</button>
    </div>`;
  bg.classList.add('open');
  document.getElementById('mCancel').onclick = closeModal;
  document.querySelectorAll('[data-map]').forEach(sel=>{
    sel.onchange = ()=>{ tradeImport.mapping[sel.dataset.map] = sel.value; };
  });
  document.getElementById('mNext').onclick = ()=>{
    const missing = CSV_FIELD_DEFS.filter(f=>f.required && !tradeImport.mapping[f.key]);
    if(missing.length){ alert(`Please map: ${missing.map(f=>f.label).join(', ')}`); return; }
    renderCsvPreviewStep();
  };
}

// Accepts YYYY-MM-DD or DD-MM-YYYY (with - or / separators); falls back to the browser's date
// parser for anything else. Returns null if nothing usable comes out.
function parseFlexibleDate(raw){
  if(raw==null || raw==='') return null;
  const s = String(raw).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return s;
  m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
  if(m){ const [,d,mo,y] = m; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  const d = new Date(s);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return null;
}
function normalizeSide(raw){
  const s = String(raw||'').trim().toUpperCase();
  if(s.startsWith('S')) return 'SHORT'; // Short, Sell, S
  return 'LONG'; // Long, Buy, B, or unrecognized — LONG is the safer default for a directional trade
}
function matchTag(raw, list){
  if(!raw) return null;
  const s = String(raw).trim();
  if(!s) return null;
  const hit = list.find(x=>x.toLowerCase()===s.toLowerCase());
  return hit || null;
}
function buildTradeFromCsvRow(row){
  const m = tradeImport.mapping;
  const errors = [];
  const symbol = m.symbol ? String(row[m.symbol]||'').trim().toUpperCase() : '';
  const side = normalizeSide(m.side ? row[m.side] : '');
  const entry = m.entry ? parseFlexibleDate(row[m.entry]) : null;
  const exit = m.exit ? parseFlexibleDate(row[m.exit]) : null;
  const entryPrice = m.entryPrice ? parseFloat(row[m.entryPrice]) : NaN;
  const exitPrice = m.exitPrice ? parseFloat(row[m.exitPrice]) : NaN;
  const qty = m.qty ? parseFloat(row[m.qty]) : NaN;
  const initSLraw = m.initSL ? row[m.initSL] : '';
  const initSL = initSLraw==='' || initSLraw==null ? null : parseFloat(initSLraw);
  const strategy = m.strategy ? matchTag(row[m.strategy], state.strategies) : null;
  const setup = m.setup ? matchTag(row[m.setup], state.setups) : null;
  const remarks = m.remarks ? String(row[m.remarks]||'').trim()||null : null;

  if(!symbol) errors.push('Missing Symbol');
  if(!entry) errors.push('Unrecognized Entry Date');
  if(!exit) errors.push('Unrecognized Exit Date');
  if(entry && exit && exit<entry) errors.push('Exit Date is before Entry Date');
  if(isNaN(entryPrice) || entryPrice<=0) errors.push('Invalid Entry Price');
  if(isNaN(exitPrice) || exitPrice<=0) errors.push('Invalid Exit Price');
  if(isNaN(qty) || qty<=0) errors.push('Invalid Quantity');
  if(m.initSL && initSLraw!=='' && isNaN(initSL)) errors.push('Invalid Init SL');

  return { rec: { id: uid(), posId: null, symbol, side, entry, exit, entryPrice, exitPrice, qty,
    initSL: (initSL!=null && !isNaN(initSL)) ? initSL : null, strategy, setup, remarks,
    posPctAtClose: null, pImpactAtClose: null }, errors,
    tagNotes: [ m.strategy && row[m.strategy] && !strategy ? `Strategy "${row[m.strategy]}" not in your configured list — left blank` : null,
                m.setup && row[m.setup] && !setup ? `Setup "${row[m.setup]}" not in your configured list — left blank` : null
              ].filter(Boolean) };
}

// A trade is treated as a duplicate if Symbol + Entry Date + Exit Date + Qty + Entry Price + Exit
// Price all match — matching against both trades already in the Booked Trades and earlier rows already
// seen in this same import (so a file with the same line twice doesn't just import it twice).
function tradeDupeKey(t){ return `${t.symbol}|${t.entry}|${t.exit}|${t.qty}|${t.entryPrice}|${t.exitPrice}`; }

function renderCsvPreviewStep(){
  const parsed = tradeImport.rows.map(buildTradeFromCsvRow);
  const existingKeys = new Set(state.trades.map(tradeDupeKey));
  const seenInFile = new Set();
  parsed.forEach(p=>{
    if(p.errors.length) return;
    const key = tradeDupeKey(p.rec);
    p.isDuplicate = existingKeys.has(key) || seenInFile.has(key);
    seenInFile.add(key);
  });
  const invalid = parsed.filter(p=>p.errors.length>0);
  const dupes = parsed.filter(p=>p.errors.length===0 && p.isDuplicate);
  const clean = parsed.filter(p=>p.errors.length===0 && !p.isDuplicate);
  const tagWarnings = parsed.reduce((n,p)=>n+p.tagNotes.length, 0);
  const bg = document.getElementById('modalBg');
  const renderRows = (includeDupes)=>{
    const valid = includeDupes ? clean.concat(dupes) : clean;
    document.getElementById('mImport').textContent = `Import ${valid.length} Trade${valid.length===1?'':'s'}`;
    document.getElementById('mImport').disabled = !valid.length;
    return valid;
  };
  const statusLabel = p => p.errors.length ? p.errors.join('; ') : (p.isDuplicate ? 'Duplicate — matches an existing trade' : 'OK');
  document.getElementById('modalBody').innerHTML = `
    <h3>Preview Import</h3>
    <p class="desc"><span class="pos" style="font-weight:600">${clean.length} ready to import</span>${dupes.length?` · <span style="color:var(--muted);font-weight:600">${dupes.length} duplicate${dupes.length===1?'':'s'} skipped</span>`:''}${invalid.length?` · <span class="neg" style="font-weight:600">${invalid.length} will be skipped</span>`:''}${tagWarnings? ` · <span style="color:var(--muted)">${tagWarnings} Strategy/Setup value${tagWarnings>1?'s':''} left blank</span>` : ''}</p>
    ${dupes.length? `<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)"><input type="checkbox" id="includeDupes"> Import the ${dupes.length} duplicate${dupes.length===1?'':'s'} anyway (matched on Symbol + Entry/Exit Date + Entry/Exit Price + Qty — could be a genuinely repeated trade, not always a mistake)</label>` : ''}
    <div class="table-scroll" style="max-height:320px;margin-top:12px"><table><thead><tr>
      <th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>Entry Price</th><th>Exit Price</th><th>Qty</th><th>Status</th>
    </tr></thead><tbody>
    ${parsed.slice(0,50).map(p=>`<tr>
      <td>${p.rec.symbol||'—'}</td><td>${p.rec.side}</td><td>${p.rec.entry||'—'}</td><td>${p.rec.exit||'—'}</td>
      <td>${isNaN(p.rec.entryPrice)?'—':p.rec.entryPrice}</td><td>${isNaN(p.rec.exitPrice)?'—':p.rec.exitPrice}</td><td>${isNaN(p.rec.qty)?'—':p.rec.qty}</td>
      <td class="${p.errors.length?'neg':(p.isDuplicate?'':'pos')}" style="${p.isDuplicate&&!p.errors.length?'color:var(--muted)':''}">${statusLabel(p)}</td>
    </tr>`).join('')}
    </tbody></table></div>
    ${parsed.length>50? `<p class="desc" style="margin-top:8px">Showing the first 50 of ${parsed.length} rows.</p>` : ''}
    <div class="modal-actions">
      <button class="btn" id="mBack">Back</button>
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mImport">Import ${clean.length} Trade${clean.length===1?'':'s'}</button>
    </div>`;
  bg.classList.add('open');
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBack').onclick = renderCsvMappingStep;
  let currentValid = clean;
  const dupeCheckbox = document.getElementById('includeDupes');
  if(dupeCheckbox) dupeCheckbox.onchange = ()=>{ currentValid = renderRows(dupeCheckbox.checked); };
  document.getElementById('mImport').onclick = async ()=>{
    const toImport = currentValid;
    const skippedCount = invalid.length + (dupeCheckbox && dupeCheckbox.checked ? 0 : dupes.length);
    if(!toImport.length){ alert('No trades to import.'); return; }
    // Stamp POS %/Impact in chronological order by exit date, same as if these had been entered
    // one at a time — matches how stampCapitalSnapshot is used everywhere else in the app.
    const ordered = toImport.map(p=>p.rec).sort((a,b)=> new Date(a.exit) - new Date(b.exit));
    ordered.forEach(rec=>{ state.trades.push(rec); stampCapitalSnapshot(rec); });
    await persistTrades();
    closeModal();
    render();
    alert(`Imported ${ordered.length} trade${ordered.length===1?'':'s'}.${skippedCount? ` ${skippedCount} row${skippedCount===1?'':'s'} were skipped — see the row statuses if you'd like to fix and re-import just those.` : ''}`);
  };
}

function delTrade(id){ if(!confirm('Delete this trade?')) return; state.trades = state.trades.filter(t=>t.id!==id); persistTrades(); render(); }
function delOpen(id){ if(!confirm('Delete this position?')) return; state.openTrades = state.openTrades.filter(t=>t.id!==id); persistOpen(); render(); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }

function openTradeModal(id){
  const t = id ? state.trades.find(x=>x.id===id) : null;
  const planParsed = parsePlanTag(t?.remarks);
  const bg = document.getElementById('modalBg');
  document.getElementById('modalBody').innerHTML = `
    <h3>${t?'Edit':'Log'} Closed Trade</h3>
    <div class="form-grid">
      <div class="field"><label>Symbol</label><input id="mSymbol" value="${t?.symbol||''}"></div>
      <div class="field"><label>Side</label><select id="mSide"><option value="LONG" ${t?.side==='LONG'?'selected':''}>Long</option><option value="SHORT" ${t?.side==='SHORT'?'selected':''}>Short</option></select></div>
      <div class="field"><label>Entry Date</label><input type="date" id="mEntry" value="${t?.entry||''}"></div>
      <div class="field"><label>Exit Date</label><input type="date" id="mExit" value="${t?.exit||''}"></div>
      <div class="field"><label>Entry Price</label><input type="number" step="any" id="mEntryPrice" value="${t?.entryPrice??''}"></div>
      <div class="field"><label>Exit Price</label><input type="number" step="any" id="mExitPrice" value="${t?.exitPrice??''}"></div>
      <div class="field"><label>Quantity</label><input type="number" step="any" id="mQty" value="${t?.qty??''}"></div>
      <div class="field"><label>Init SL</label><input type="number" step="any" id="mSL" value="${t?.initSL??''}"></div>
      <div class="field"><label>INIT SL %</label><input id="mIntRisk" disabled></div>
      <div class="field"><label>Followed Plan</label><select id="mFollowedPlan">
        <option value="" ${planParsed.followed==null?'selected':''}>Not set</option>
        <option value="yes" ${planParsed.followed===true?'selected':''}>Yes</option>
        <option value="no" ${planParsed.followed===false?'selected':''}>No</option>
      </select></div>
      <div class="field full"><label>Strategy</label><select id="mStrategy">${strategyOptions(t?.strategy)}</select></div>
      <div class="field full"><label>Setup</label><select id="mSetup">${setupOptions(t?.setup)}</select></div>
      <div class="field full"><label>Notes</label><textarea id="mRemarks">${planParsed.text}</textarea></div>
    </div>
    <div class="modal-actions">
      ${t?'<button class="btn btn-danger" id="mDel">Delete</button>':''}
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">Save</button>
    </div>`;
  bg.classList.add('open');
  const updateIntRisk = ()=>{
    const out = document.getElementById('mIntRisk');
    const ep = parseFloat(document.getElementById('mEntryPrice').value);
    const sl = parseFloat(document.getElementById('mSL').value);
    out.value = (!isNaN(ep) && ep>0 && !isNaN(sl)) ? fmtPct(Math.abs(ep-sl)/ep) : '—';
  };
  updateIntRisk();
  document.getElementById('mSL').oninput = updateIntRisk;
  document.getElementById('mEntryPrice').oninput = updateIntRisk;
  document.getElementById('mCancel').onclick = closeModal;
  if(t) document.getElementById('mDel').onclick = ()=>{ closeModal(); delTrade(t.id); };
  document.getElementById('mSave').onclick = ()=>{
    const followedVal = document.getElementById('mFollowedPlan').value;
    const followed = followedVal==='yes'?true:(followedVal==='no'?false:null);
    const rec = { id: t?t.id:uid(), posId: t?t.posId:null, symbol: document.getElementById('mSymbol').value.trim().toUpperCase(),
      side: document.getElementById('mSide').value, entry: document.getElementById('mEntry').value,
      exit: document.getElementById('mExit').value, entryPrice: parseFloat(document.getElementById('mEntryPrice').value),
      exitPrice: parseFloat(document.getElementById('mExitPrice').value), qty: parseFloat(document.getElementById('mQty').value),
      initSL: document.getElementById('mSL').value===''?null:parseFloat(document.getElementById('mSL').value),
      strategy: document.getElementById('mStrategy').value.trim()||null,
      setup: document.getElementById('mSetup').value.trim()||null, remarks: buildRemarksWithPlan(followed, document.getElementById('mRemarks').value),
      posPctAtClose: t ? (t.posPctAtClose ?? null) : null, pImpactAtClose: t ? (t.pImpactAtClose ?? null) : null };
    if(!rec.symbol || isNaN(rec.entryPrice) || isNaN(rec.exitPrice) || isNaN(rec.qty)){ alert('Symbol, entry price, exit price and qty are required.'); return; }
    if(t){ state.trades = state.trades.map(x=>x.id===t.id?rec:x); } else { state.trades.push(rec); stampCapitalSnapshot(rec); }
    persistTrades(); closeModal(); render();
  };
}

function openOpenModal(id){
  const t = id ? state.openTrades.find(x=>x.id===id) : null;
  const bg = document.getElementById('modalBg');
  const singleLot = t && (!t.lots || t.lots.length<=1);
  const entryFields = !t ? `
      <div class="field"><label>Entry Date</label><input type="date" id="mEntry" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Entry Price</label><input type="number" step="any" id="mEntryPrice"></div>
      <div class="field"><label>Quantity</label><input type="number" step="any" id="mQty"></div>` : singleLot ? `
      <div class="field"><label>Entry Date</label><input type="date" id="mEntry" value="${t.entry}"></div>
      <div class="field"><label>Entry Price</label><input type="number" step="any" id="mEntryPrice" value="${t.entryPrice}"></div>
      <div class="field"><label>Quantity</label><input type="number" step="any" id="mQty" value="${t.qty}"></div>` : `
      <div class="field"><label>Entry Date</label><input value="${fmtDate(t.entry)}" disabled></div>
      <div class="field"><label>Entry Price (avg)</label><input id="mEntryPrice" value="${t.entryPrice.toFixed(2)}" disabled></div>
      <div class="field"><label>Quantity (total)</label><input value="${t.qty}" disabled></div>`;
  document.getElementById('modalBody').innerHTML = `
    <h3>${t?'Edit':'Add'} Open Trade</h3>
    <div class="form-grid">
      <div class="field"><label>Symbol</label><input id="mSymbol" value="${t?.symbol||''}"></div>
      <div class="field"><label>Side</label><select id="mSide"><option value="LONG" ${t?.side==='LONG'?'selected':''}>Long</option><option value="SHORT" ${t?.side==='SHORT'?'selected':''}>Short</option></select></div>
      ${entryFields}
      <div class="field"><label>Init SL</label><input type="number" step="any" id="mSL" value="${t?.initSL??''}"></div>
      <div class="field"><label>INIT SL %</label><input id="mIntRisk" disabled></div>
      <div class="field"><label>Trail SL</label><input type="number" step="any" id="mTSL" value="${t?.trailedSL??''}"></div>
      <div class="field"><label>CMP</label><input type="number" step="any" id="mCmp" value="${t?.cmp??''}"></div>
      <div class="field full"><label>Strategy</label><select id="mStrategy">${strategyOptions(t?.strategy)}</select></div>
      <div class="field full"><label>Setup</label><select id="mSetup">${setupOptions(t?.setup)}</select></div>
    </div>
    ${!t?'<p class="desc">If this symbol is already open, this adds a new entry instead of duplicating it.</p>':''}
    ${t && !singleLot?'<p class="desc">Multiple entries — Date and Quantity shown as totals. Edit individual entries from Open Trades.</p>':''}
    <div class="modal-actions">
      ${t?'<button class="btn btn-danger" id="mDel">Delete</button>':''}
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">Save</button>
    </div>`;
  bg.classList.add('open');
  const updateIntRisk = ()=>{
    const out = document.getElementById('mIntRisk');
    if(!out) return;
    const epEl = document.getElementById('mEntryPrice');
    const ep = epEl ? parseFloat(epEl.value) : NaN;
    const sl = parseFloat(document.getElementById('mSL').value);
    out.value = (!isNaN(ep) && ep>0 && !isNaN(sl)) ? fmtPct(Math.abs(ep-sl)/ep) : '—';
  };
  updateIntRisk();
  document.getElementById('mSL').oninput = updateIntRisk;
  const epEl = document.getElementById('mEntryPrice');
  if(epEl && !epEl.disabled) epEl.oninput = updateIntRisk;
  document.getElementById('mCancel').onclick = closeModal;
  if(t) document.getElementById('mDel').onclick = ()=>{ closeModal(); delOpen(t.id); };
  document.getElementById('mSave').onclick = ()=>{
    const symbol = document.getElementById('mSymbol').value.trim().toUpperCase();
    const side = document.getElementById('mSide').value;
    const initSL = document.getElementById('mSL').value===''?null:parseFloat(document.getElementById('mSL').value);
    const trailedSL = document.getElementById('mTSL').value===''?null:parseFloat(document.getElementById('mTSL').value);
    const cmp = document.getElementById('mCmp').value===''?null:parseFloat(document.getElementById('mCmp').value);
    const strategy = document.getElementById('mStrategy').value.trim()||null;
    const setup = document.getElementById('mSetup').value.trim()||null;
    if(!symbol){ alert('Symbol is required.'); return; }
    if(t){
      const dupe = state.openTrades.find(x=>x.id!==t.id && x.symbol.toUpperCase()===symbol);
      if(dupe){ alert(`Another open trade for ${symbol} already exists. Use its Add button to add quantity instead.`); return; }
      if(singleLot){
        const newDate = document.getElementById('mEntry').value;
        const newPrice = parseFloat(document.getElementById('mEntryPrice').value);
        const newQty = parseFloat(document.getElementById('mQty').value);
        if(!newDate || isNaN(newPrice) || newPrice<=0 || isNaN(newQty) || newQty<=0){ alert('Entry date, a positive entry price and a positive quantity are required.'); return; }
        if(t.lots && t.lots.length){ t.lots[0].date = newDate; t.lots[0].price = newPrice; t.lots[0].qty = newQty; }
        else { t.lots = [{ id: uid(), date: newDate, price: newPrice, qty: newQty }]; }
        recomputeFromLots(t);
      }
      Object.assign(t, { symbol, side, initSL, trailedSL, cmp, strategy, setup });
      persistOpen(); closeModal(); render();
    } else {
      const entry = document.getElementById('mEntry').value;
      const entryPrice = parseFloat(document.getElementById('mEntryPrice').value);
      const qty = parseFloat(document.getElementById('mQty').value);
      if(!entry || isNaN(entryPrice) || isNaN(qty) || qty<=0){ alert('Entry date, entry price and a positive quantity are required.'); return; }
      const { merged } = mergeOrCreateOpenPosition({ symbol, side, date: entry, price: entryPrice, qty, initSL, trailedSL, cmp, strategy, setup });
      if(merged) alert(`${symbol} was already open — added as a new entry to the existing position.`);
      persistOpen(); closeModal(); render();
    }
  };
}
function openEditLotModal(posId, lotId){
  const t = state.openTrades.find(x=>x.id===posId);
  if(!t) return;
  const lot = t.lots.find(l=>l.id===lotId);
  if(!lot) return;
  const lotSL = (lot.initSL!=null) ? lot.initSL : t.initSL;
  const bg = document.getElementById('modalBg');
  document.getElementById('modalBody').innerHTML = `
    <h3>Edit Entry — ${t.symbol}</h3>
    <div class="form-grid">
      <div class="field"><label>Entry Date</label><input type="date" id="mLotDate" value="${lot.date}"></div>
      <div class="field"><label>Entry Price</label><input type="number" step="any" id="mLotPrice" value="${lot.price}"></div>
      <div class="field"><label>Quantity</label><input type="number" step="any" id="mLotQty" value="${lot.qty}"></div>
      <div class="field"><label>Init SL</label><input type="number" step="any" id="mLotSL" value="${lotSL??''}"></div>
      <div class="field"><label>INIT SL %</label><input id="mLotIntRisk" disabled></div>
      <div class="field full"><label>Notes</label><textarea id="mLotNotes">${lot.notes||''}</textarea></div>
    </div>
    <p class="desc">Recalculates Average Entry Price, Total Quantity and Invested. Position ID and entry history stay unchanged.</p>
    <div class="modal-actions">
      ${t.lots.length>1?'<button class="btn btn-danger" id="mDel">Delete</button>':''}
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">Save</button>
    </div>`;
  bg.classList.add('open');
  const updateIntRisk = ()=>{
    const out = document.getElementById('mLotIntRisk');
    const ep = parseFloat(document.getElementById('mLotPrice').value);
    const slVal = document.getElementById('mLotSL').value;
    const sl = slVal===''?NaN:parseFloat(slVal);
    out.value = (!isNaN(ep) && ep>0 && !isNaN(sl)) ? fmtPct(Math.abs(ep-sl)/ep) : '—';
  };
  updateIntRisk();
  document.getElementById('mLotPrice').oninput = updateIntRisk;
  document.getElementById('mLotSL').oninput = updateIntRisk;
  document.getElementById('mCancel').onclick = closeModal;
  if(t.lots.length>1) document.getElementById('mDel').onclick = ()=>{
    if(!confirm('Delete this entry? This cannot be undone.')) return;
    t.lots = t.lots.filter(l=>l.id!==lotId);
    recomputeFromLots(t);
    persistOpen(); closeModal(); render();
  };
  document.getElementById('mSave').onclick = ()=>{
    const date = document.getElementById('mLotDate').value;
    const price = parseFloat(document.getElementById('mLotPrice').value);
    const qty = parseFloat(document.getElementById('mLotQty').value);
    const slRaw = document.getElementById('mLotSL').value;
    const notes = document.getElementById('mLotNotes').value.trim();
    if(!date || isNaN(price) || isNaN(qty) || qty<=0){ alert('Entry date, entry price and a positive quantity are required.'); return; }
    lot.date = date; lot.price = price; lot.qty = qty;
    lot.initSL = slRaw===''?null:parseFloat(slRaw);
    lot.notes = notes||null;
    recomputeFromLots(t);
    persistOpen(); closeModal(); render();
  };
}
function openAddLotModal(id){
  const t = state.openTrades.find(x=>x.id===id);
  if(!t) return;
  const bg = document.getElementById('modalBg');
  document.getElementById('modalBody').innerHTML = `
    <h3>Add to ${t.symbol}</h3>
    <div class="form-grid">
      <div class="field"><label>Entry Date</label><input type="date" id="mLotDate" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Entry Price</label><input type="number" step="any" id="mLotPrice"></div>
      <div class="field"><label>Added Quantity</label><input type="number" step="any" id="mLotQty"></div>
    </div>
    <p class="desc">Current: ${t.qty} @ ${t.entryPrice.toFixed(2)} avg. Strategy, Setup and Init SL stay as already set on this position.</p>
    <div class="modal-actions">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">Add</button>
    </div>`;
  bg.classList.add('open');
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = ()=>{
    const date = document.getElementById('mLotDate').value;
    const price = parseFloat(document.getElementById('mLotPrice').value);
    const qty = parseFloat(document.getElementById('mLotQty').value);
    if(!date || isNaN(price)){ alert('Entry date and entry price are required.'); return; }
    if(isNaN(qty) || qty<=0){ alert('Added Quantity must be greater than zero.'); return; }
    t.lots.push({ id: uid(), date, price, qty });
    recomputeFromLots(t);
    stampPositionPosPct(t);
    persistOpen(); closeModal(); render();
  };
}
function openExitModal(id){
  const t = state.openTrades.find(x=>x.id===id);
  if(!t) return;
  const initRiskPct = (t.initSL!=null && t.initSL!=='' && t.entryPrice) ? Math.abs(t.entryPrice-t.initSL)/t.entryPrice : null;
  const bg = document.getElementById('modalBg');
  document.getElementById('modalBody').innerHTML = `
    <h3>Exit ${t.symbol}</h3>
    <div class="form-grid">
      <div class="field"><label>Symbol</label><input value="${t.symbol}" disabled></div>
      <div class="field"><label>Side</label><input value="${t.side}" disabled></div>
      <div class="field"><label>Entry Date</label><input value="${fmtDate(t.entry)}" disabled></div>
      <div class="field"><label>Average Entry Price</label><input value="${t.entryPrice.toFixed(2)}" disabled></div>
      <div class="field"><label>Current Open Quantity</label><input value="${t.qty}" disabled></div>
      <div class="field"><label>Strategy</label><input value="${t.strategy||'Not Assigned'}" disabled></div>
      <div class="field"><label>Setup</label><input value="${t.setup||'—'}" disabled></div>
      <div class="field"><label>Init SL</label><input value="${t.initSL!=null?(+t.initSL).toFixed(2):'—'}" disabled></div>
      <div class="field"><label>INIT SL %</label><input value="${initRiskPct!=null?fmtPct(initRiskPct):'—'}" disabled></div>
      <div class="field"><label>Exit Price</label><input type="number" step="any" id="mExitPrice"></div>
      <div class="field"><label>Exit Quantity</label><input type="number" step="any" id="mExitQty" value="${t.qty}"></div>
      <div class="field"><label>Followed Plan</label><select id="mExitFollowedPlan">
        <option value="" selected>Not set</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select></div>
      <div class="field full"><label>Notes</label><textarea id="mExitRemarks"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">Exit</button>
    </div>`;
  bg.classList.add('open');
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = ()=>{
    const exitPrice = parseFloat(document.getElementById('mExitPrice').value);
    const exitQty = parseFloat(document.getElementById('mExitQty').value);
    const followedVal = document.getElementById('mExitFollowedPlan').value;
    const followed = followedVal==='yes'?true:(followedVal==='no'?false:null);
    const remarks = buildRemarksWithPlan(followed, document.getElementById('mExitRemarks').value);
    if(isNaN(exitPrice)){ alert('Exit Price is required.'); return; }
    if(isNaN(exitQty) || exitQty<=0){ alert('Exit Quantity must be greater than zero.'); return; }
    if(exitQty > t.qty){ alert('Exit Quantity cannot exceed the current open quantity.'); return; }
    const { consumed, remainingLots } = fifoConsume(t.lots, exitQty);
    const consumedQty = consumed.reduce((s,l)=>s+l.qty, 0);
    const consumedEntryPrice = consumedQty ? consumed.reduce((s,l)=>s+l.price*l.qty, 0)/consumedQty : t.entryPrice;
    const consumedEntryDate = consumed.length ? sortLotsAsc(consumed)[0].date : t.entry;
    const closedTrade = { id: uid(), posId: t.posId, symbol: t.symbol, side: t.side, entry: consumedEntryDate,
      exit: new Date().toISOString().slice(0,10), entryPrice: consumedEntryPrice, exitPrice, qty: exitQty,
      initSL: t.initSL, strategy: t.strategy, setup: t.setup, remarks,
      posPctAtClose: t.posPct ?? null };
    state.trades.push(closedTrade);
    stampCapitalSnapshot(closedTrade);
    if(remainingLots.length){ t.lots = remainingLots; recomputeFromLots(t); }
    else { state.openTrades = state.openTrades.filter(x=>x.id!==t.id); }
    persistTrades(); persistOpen(); closeModal(); render();
  };
}

let dbPath = null;

document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

(async function init(){
  document.getElementById('app').innerHTML = '<div class="empty" style="padding:80px 0">Loading journal…</div>';
  try{ dbPath = await window.electronAPI.getDbPath(); }catch(e){ dbPath = null; }
  await loadState();
  render();
})();
</script>
