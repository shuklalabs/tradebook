<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --void:#15171d; --panel:#1e2129; --panel2:#252932; --border:#363c47;
  --text:#e9ebf0; --muted:#838a98; --muted2:#a4abb8;
  --teal:#20d6a8; --tealDim:#164f40; --red:#ff6b6f; --redDim:#5c2429;
  --amber:#f5ab2e; --amberDim:#4d3714;
  --blue:#5b9bff;
  --font-display:'Space Grotesk',sans-serif; --font-mono:'JetBrains Mono',monospace; --font-ui:'Inter',sans-serif;
}
:root[data-theme="light"]{
  --void:#f3f4f6; --panel:#ffffff; --panel2:#f8f9fb; --border:#dfe2e8;
  --text:#1a1d24; --muted:#6b7280; --muted2:#424855;
  --teal:#0e9f78; --tealDim:#dbf5ec; --red:#dc3545; --redDim:#fbe2e4;
  --amber:#b8790b; --amberDim:#fbedcf;
  --blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--text);font-family:var(--font-ui);font-size:14px;line-height:1.5;padding:24px;min-height:100vh}
::selection{background:var(--amberDim);color:var(--amber)}
.wrap{max-width:1400px;margin:0 auto}

.topbar{display:flex;flex-direction:column;gap:0;margin-bottom:20px}
.topbar-title-row{display:flex;justify-content:flex-start;align-items:flex-start;flex-wrap:wrap;gap:12px}
.topbar h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-0.02em}
.brand-trade{color:var(--text)}
.brand-vault{color:var(--teal)}
.brand-dot{color:var(--amber)}
.topbar h1 span.sub-inline{color:var(--muted);font-size:13px;font-weight:500;letter-spacing:0;font-family:var(--font-mono);margin-left:4px}
.topbar .sub{color:var(--muted);font-size:12px;margin-top:2px;font-family:var(--font-mono)}
.topbar .sub.sub2{margin-top:6px}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:-31px}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:6px;font-family:var(--font-ui);font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--muted2)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn-primary{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:600}
.btn-primary:hover{background:#ffb63f}
.btn-ghost{background:transparent}
.btn-danger{color:var(--red)}
.btn-sm{padding:5px 10px;font-size:12px}

.stat-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px}
.stat{background:var(--panel);padding:14px 16px}
.stat .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat .val{font-family:var(--font-mono);font-size:19px;font-weight:600}
.stat .sub-val{font-family:var(--font-mono);font-size:11px;margin-top:2px;opacity:.8}
.pos{color:var(--teal)} .neg{color:var(--red)} .neu{color:var(--text)}

.hero{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:22px 24px;margin-bottom:20px}
.hero-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;flex-wrap:wrap;gap:8px}
.hero-head h2{font-family:var(--font-display);font-size:17px;font-weight:600}
.hero-head .tag{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.hero p.desc{color:var(--muted2);font-size:12.5px;margin-bottom:14px;max-width:640px}
.hist-wrap{height:220px}

.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}.stat-strip{grid-template-columns:repeat(4,1fr)}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px}
.panel h3{font-family:var(--font-display);font-size:15px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.panel h3 small{font-family:var(--font-mono);color:var(--muted);font-weight:400;font-size:11px}
.chart-wrap{height:220px}

.setup-row{display:grid;grid-template-columns:1fr 60px 70px 90px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.discipline-row{display:grid;grid-template-columns:1fr auto 120px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.discipline-row:last-child{border-bottom:none}
.discipline-row .setup-name{text-align:left}
.discipline-row .discipline-context{text-align:left;font-family:var(--font-mono);color:var(--muted2)}
.setup-row:last-child{border-bottom:none}
.setup-name{font-weight:500}
.setup-count{color:var(--muted);font-family:var(--font-mono);text-align:right}
.setup-wr{font-family:var(--font-mono);text-align:right}
.bar-track{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;grid-column:1/-1;margin-top:2px}
.bar-fill{height:100%;background:var(--teal)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);font-family:var(--font-mono);white-space:nowrap}
tbody tr:nth-child(even){background:color-mix(in srgb, var(--panel2) 35%, transparent)}
tbody tr:hover{background:var(--panel2)}
.side-long{color:var(--teal);font-family:var(--font-ui);font-weight:600;font-size:11px}
.side-short{color:var(--red);font-family:var(--font-ui);font-weight:600;font-size:11px}
.pill{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:11px;font-family:var(--font-ui);color:var(--muted2)}
.entries-row td{background:var(--panel2);padding:8px 16px 10px 40px;border-top:none}
.entries-list{display:flex;flex-direction:column;gap:3px;font-family:var(--font-mono);font-size:12px;color:var(--muted2)}
.posid-label{font-family:var(--font-mono);font-weight:400;font-size:10px;color:var(--muted);margin-top:2px}
.table-scroll{overflow-x:auto}
.row-actions{display:flex;gap:6px}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px}
.icon-btn:hover{color:var(--text)}

.filters{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;margin-bottom:14px}
.filters input{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:12.5px;font-family:var(--font-ui)}
.filters .fy-picker{flex:0 0 auto}
.filters input[type=text]{flex:1 1 auto;min-width:140px}

.log-panel{margin-bottom:20px}
.remark{color:var(--muted2);font-family:var(--font-ui);white-space:normal;max-width:170px;font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.empty{color:var(--muted);text-align:center;padding:30px;font-size:13px}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(4,5,8,.7);backdrop-filter:blur(2px);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
.modal h3{font-family:var(--font-display);font-size:17px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:6px;font-family:var(--font-ui);font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
textarea{resize:vertical;min-height:50px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.field{margin-bottom:0}

footer{color:var(--muted);font-size:11px;text-align:center;margin-top:24px;font-family:var(--font-mono)}

.tabnav{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab-btn{background:none;border:none;color:var(--muted);padding:10px 14px;font-family:var(--font-ui);font-size:15px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--amber);border-bottom-color:var(--amber)}
.tab-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.panel h3{gap:10px}
.panel h3 .btn:first-of-type{margin-left:auto}
input.mini,select.mini{padding:5px 7px;font-size:12px;font-family:var(--font-mono)}
td select.mini{font-family:var(--font-ui)}

.howto h4{font-family:var(--font-display);font-size:14px;color:var(--amber);margin:18px 0 6px}
.howto h4:first-child{margin-top:0}
.howto p{color:var(--muted2);font-size:13px;line-height:1.7;max-width:760px}
.howto b{color:var(--text);font-weight:600}

.fy-picker{display:flex;align-items:center;gap:6px}
.fy-picker label{margin:0;font-size:10.5px}
.fy-picker select{padding:7px 10px;font-size:12.5px}
.mm-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.mm-row:last-child{border-bottom:none}
.mm-row .mm-lbl{font-size:12.5px;color:var(--muted2)}
.mm-row .mm-val{font-family:var(--font-mono);font-size:15px;font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<script src="lib/xlsx.full.min.js"></script>
<script>
// ---- Standalone preview shim -------------------------------------------------------------
// When this file is opened directly in a browser (not inside the Electron shell), there is no
// window.electronAPI. This shim reproduces the same interface using localStorage / native browser
// dialogs, purely so the Money Management / Financial Year work can be reviewed as a static file
// before it's wired into the real Electron app. It never overrides a real electronAPI if present.
if(!window.electronAPI){
  window.electronAPI = {
    kvGet: async (key) => { const v = localStorage.getItem('tv_'+key); return v; },
    kvSet: async (key, value) => { localStorage.setItem('tv_'+key, value); return true; },

// Assigned once, when an Open Trade is first created, and never changes — Add/Exit on that

// FY start/end dates (April 1 -> March 31), and the FY that chronologically follows another.
function fyEndDate(fy){ if(!fy) return null; const startYear = parseInt(fy.split('-')[0],10); return `${startYear+1}-03-31`; }
function nextFYCode(fy){ const startYear = parseInt(fy.split('-')[0],10)+1; return `${startYear}-${(startYear+1).toString().slice(-2)}`; }

// The permanent origin point of the whole portfolio — the earliest Financial Year's Starting
// Capital. Unlike the old global state.startingCapital, this stays correct even after Starting
// Capital is edited via ✎, since it always reads straight from the ledger.
function earliestStartingCapital(){
  if(!state.financialYears.length) return state.startingCapital || 0;
  const earliest = [...state.financialYears].sort((a,b)=> a.fy<b.fy? -1 : (a.fy>b.fy? 1 : 0))[0];
  return earliest.openingBalance;
}
// True if no FY earlier than this one exists in the ledger — i.e. this is the very first FY ever
// recorded, so its Opening Balance is the original "starting capital" rather than something
// produced by a prior Close FY.
function isEarliestFY(fy){ return !state.financialYears.some(f=>f.fy < fy); }

// A capital transaction's signed effect on the running balance. Withdrawal amounts are always
// stored positive and subtracted here; Opening Balance / Deposit / P&L Transfer add directly
// (a P&L Transfer amount is itself signed — negative for a loss-making FY).
function txDelta(t){
  if(t.type==='Opening Balance' || t.type==='P/L Transfer' || t.type==='Starting Capital') return t.amount;
  return t.drCr==='Dr' ? -Math.abs(t.amount) : Math.abs(t.amount); // Deposit / Withdrawal / Adjustment
}
function getCapitalTransactionsForFY(fy){

    .sort((a,b)=> new Date(a.date)-new Date(b.date) || String(a.id).localeCompare(String(b.id)));

// Chronological transactions for an FY with a running balance stamped on each row.
function capitalTransactionsWithBalance(fy){
  let bal = 0;
  return getCapitalTransactionsForFY(fy).map(t=>{ bal += txDelta(t); return {...t, balance: bal}; });
}
// Capital Balance: the ledger's own running balance for the FY (Opening Balance ± Deposits/
// Withdrawals ± a posted P&L Transfer). Never includes this FY's not-yet-transferred trade P&L —
// that's Net P/L (FY), kept separate below.
function capitalBalance(fy){
  const rows = capitalTransactionsWithBalance(fy);
  if(rows.length) return rows[rows.length-1].balance;
  const entry = getFYEntry(fy);
  return entry ? entry.openingBalance : state.startingCapital;
}
// Net P/L (FY): realized (booked) P&L for trades closed within this FY that haven't yet been
// swept into a P&L Transfer by Close FY. Once Close FY runs for this FY, this returns to being
// "this FY's full realized P&L" permanently (it's a historical figure at that point).
function netPLForFY(fy){
  if(!fy) return 0;
  return state.trades.map(computeClosed).filter(t=>t.fy===fy).reduce((s,t)=>s+t.pnl,0);
}
// Current Capital = Capital Balance (FY) + Net P/L (FY). For historical FYs (zero deposits/
// withdrawals, as today) this is mathematically identical to the old all-time formula
// (Starting Capital + realized P&L up to that point) — verified during migration.
function getCurrentCapital(fy){
  fy = (fy && fy!=='ALL') ? fy : realCurrentFY();
  const entry = getFYEntry(fy);
  if(entry && entry.isClosed) return capitalBalance(fy); // P&L already folded in via that FY's P/L Transfer

function capitalInUseTotal(){ return state.openTrades.map(computeOpen).reduce((s,t)=>s+t.capital,0); }

// The true, continuous all-time ledger: every FY's Opening Balance transaction is just a carry-
// forward echo of the previous FY's closing balance (its amount already equals it) — including it
// here would double-count. The real events are Starting Capital (once), each FY's P&L Transfer,
// and any manual Deposit/Withdrawal/Adjustment. Chained together, these alone reproduce the exact
// same continuous balance as walking the FYs one at a time.
function allTimeCapitalTransactionsWithBalance(){
  const rows = state.capitalTransactions.filter(t=>t.type!=='Opening Balance')
    .sort((a,b)=> new Date(a.date)-new Date(b.date) || String(a.id).localeCompare(String(b.id)));

  return rows.map(t=>{ bal += txDelta(t); return {...t, balance: bal}; });
}

// One-time migration: builds Financial Year entities and an Opening-Balance-only capital ledger
// from the existing single global Starting Capital + trade history, so every past number stays
// exactly what it is today. Runs once — guarded by the presence of 'journal-fy-list' in storage.
function buildInitialLedger(){
  const allTradeFYs = new Set(state.trades.map(t=>getFY(t.exit)).filter(Boolean));
  const cur = currentFY();
  allTradeFYs.add(cur);
  const fys = [...allTradeFYs].sort(); // ascending, oldest first
  const financialYears = [];
  const capitalTransactions = [];
  fys.forEach((fy,i)=>{
    const startDate = fyStartDate(fy);
    const openingBalance = capitalAsOf(startDate);
    financialYears.push({ fy, startDate, endDate: fyEndDate(fy), openingBalance,
      isCurrent: fy===cur, isClosed: fy!==cur, closedAt: null });
    // The earliest FY's anchor transaction is 'Starting Capital' (permanent, never editable);
    // every later FY still gets 'Opening Balance', same as one created by a real Close FY.
    const isEarliest = i===0;
    capitalTransactions.push({ id: uid(), fy, date: startDate, type: isEarliest? 'Starting Capital' : 'Opening Balance',
      amount: openingBalance, notes: isEarliest? `FY${fy} Starting Capital` : `FY${fy} Opening Balance` });
  });
  return { financialYears, capitalTransactions };
}
function holdingDays(entry, exit){
  if(!entry || !exit) return null;
  const d1=new Date(entry), d2=new Date(exit); if(isNaN(d1)||isNaN(d2)) return null;
  return Math.max(0, Math.round((d2-d1)/86400000));
}
function fmtHold(days){ return days==null ? 'Open' : (days+'d'); }

function computeClosed(t){
  const entryValue = t.entryPrice*t.qty, exitValue = t.exitPrice*t.qty;
  const pnl = t.side==='SHORT' ? (t.entryPrice-t.exitPrice)*t.qty : (t.exitPrice-t.entryPrice)*t.qty;
  const pctReturn = entryValue ? pnl/entryValue : null;
  const initRisk = (t.initSL!=null && t.initSL!=='') ? Math.abs(t.entryPrice-t.initSL)*t.qty : null;
  const initRiskPct = (t.initSL!=null && t.initSL!=='' && t.entryPrice) ? Math.abs(t.entryPrice-t.initSL)/t.entryPrice : null;
  const rrr = (initRisk && initRisk>0) ? pnl/initRisk : null;
  const holdDays = holdingDays(t.entry, t.exit);
  const fy = getFY(t.exit);
  return {...t, entryValue, exitValue, pnl, pctReturn, initRisk, initRiskPct, rrr, holdDays, fy};
}
function computeOpen(t){
  const capital = t.entryPrice*t.qty, cmp = t.cmp!=null ? t.cmp : t.entryPrice;
  const absRet = t.side==='SHORT' ? (t.entryPrice-cmp)*t.qty : (cmp-t.entryPrice)*t.qty;
  const pctRet = capital? absRet/capital : null;
  const effSL = (t.trailedSL!=null && t.trailedSL!=='') ? t.trailedSL : t.initSL;
  const initRiskPct = (t.initSL!=null && t.initSL!=='' && t.entryPrice) ? Math.abs(t.entryPrice-t.initSL)/t.entryPrice : null;
  const initRisk = (t.initSL!=null && t.initSL!=='') ? Math.abs(t.entryPrice-t.initSL)*t.qty : null;
  const rrr = (initRisk && initRisk>0) ? absRet/initRisk : null;

// --- Open trade "lots" (entry history) helpers ---
// Every open trade is built from one or more lots (entries), oldest first. entry/entryPrice/qty
// on the position itself are always kept in sync as the weighted-average view of its lots.
function sortLotsAsc(lots){ return [...lots].sort((a,b)=>new Date(a.date)-new Date(b.date)); }
function migrateLegacyLots(t){
  if(!t.lots || !t.lots.length) t.lots = [{ id: uid(), date: t.entry, price: t.entryPrice, qty: t.qty }];
  return t;
}
function recomputeFromLots(t){
  const lots = sortLotsAsc(t.lots);
  const qty = lots.reduce((s,l)=>s+l.qty, 0);
  const entryPrice = qty ? lots.reduce((s,l)=>s+l.price*l.qty, 0)/qty : t.entryPrice;
  t.lots = lots; t.qty = qty; t.entryPrice = entryPrice; t.entry = lots.length? lots[0].date : t.entry;
  return t;
}
// Stamps/refreshes a position's POS % using its current total Invested against Current Capital
// right now. Called only when a new entry is created (first entry, or a scale-in add) — never on
// mere edits or market movement, so it always reflects "capital committed at the moment of entry."
function stampPositionPosPct(t){
  const capital = t.entryPrice * t.qty;
  const cc = getCurrentCapital(getFY(t.entry) || currentFY());
  t.posPct = cc ? capital/cc : null;
}
// Adds a new lot to an existing open trade for the same symbol, or creates a fresh one if none exists.
// Returns { merged, position } — merged=true means it was folded into an existing position (no duplicate created).
function mergeOrCreateOpenPosition({symbol, side, date, price, qty, initSL, trailedSL, cmp, strategy, setup}){
  const existing = state.openTrades.find(x=>x.symbol.toUpperCase()===symbol.toUpperCase());
  if(existing){
    migrateLegacyLots(existing);
    existing.lots.push({ id: uid(), date, price, qty });
    recomputeFromLots(existing);
    stampPositionPosPct(existing);
    return { merged:true, position: existing };
  }
  const position = { id: uid(), posId: nextPosId(date), symbol, side, entry: date, entryPrice: price, qty,
    initSL: initSL??null, trailedSL: trailedSL??null, cmp: cmp??price, strategy: strategy??null, setup: setup??null,
    lots: [{ id: uid(), date, price, qty }] };
  stampPositionPosPct(position);
  state.openTrades.push(position);
  return { merged:false, position };
}
// Consumes qty oldest-lot-first (FIFO). Returns the consumed portion (for the Booked Trades entry) and
// what's left of the lots after the exit.
function fifoConsume(lots, exitQty){
  const sorted = sortLotsAsc(lots);
  let remaining = exitQty;
  const consumed = [], remainingLots = [];
  for(const lot of sorted){
    if(remaining<=0){ remainingLots.push(lot); continue; }
    if(lot.qty <= remaining){ consumed.push({...lot}); remaining -= lot.qty; }
    else { consumed.push({...lot, qty: remaining}); remainingLots.push({...lot, qty: lot.qty-remaining}); remaining = 0; }
  }
  return { consumed, remainingLots };
}
function computeSizing(r, capital, riskPct){
  const riskPerShare = (r.entryPrice!=null && r.sl!=null) ? Math.abs(r.entryPrice-r.sl) : null;
  const slPct = (riskPerShare!=null && r.entryPrice) ? riskPerShare/r.entryPrice : null;
  const riskAmount = capital * riskPct/100;
  const qty = (riskPerShare && riskPerShare>0) ? Math.ceil((riskAmount/riskPerShare)/5)*5 : 0;
  const positionValue = qty * (r.entryPrice||0);
  const pctOfCapital = capital ? positionValue/capital : null;
  return {...r, riskPerShare, slPct, riskAmount, qty, positionValue, pctOfCapital};
}

async function loadState(){
  try{ const s = await lsGet('journal-settings'); if(s){ const p=JSON.parse(s.value); state.startingCapital=p.startingCapital; state.riskPct=p.riskPct; state.wcs=p.wcs??20; state.lastUpdated=p.lastUpdated??null; state.posIdCounters=p.posIdCounters??{}; } }catch(e){}
  try{ const t = await lsGet('journal-trades'); state.trades = t ? JSON.parse(t.value) : []; }catch(e){ state.trades = []; }
  try{ const o = await lsGet('journal-open'); state.openTrades = o ? JSON.parse(o.value) : []; }catch(e){ state.openTrades = []; }
  // One-time migration: give every open trade a lots history, and enforce single-position-per-symbol
  // by folding any duplicate-symbol legacy positions into one (oldest lots first).
  let openMigrated = false;
  state.openTrades.forEach(t=>{ if(!t.lots || !t.lots.length){ migrateLegacyLots(t); openMigrated = true; } });
  { const bySymbol = {};
    state.openTrades.forEach(t=>{
      const key = t.symbol.toUpperCase();
      if(!bySymbol[key]) bySymbol[key] = t;
      else { bySymbol[key].lots.push(...t.lots); openMigrated = true; }
    });
    const deduped = Object.values(bySymbol);
    if(deduped.length !== state.openTrades.length){ deduped.forEach(recomputeFromLots); state.openTrades = deduped; openMigrated = true; }
  }
  // One-time migration: assign a Pos ID to any legacy open trade that predates this feature,
  // oldest entry first so numbering reads sensibly.
  state.openTrades.filter(t=>!t.posId).sort((a,b)=>new Date(a.entry)-new Date(b.entry))
    .forEach(t=>{ t.posId = nextPosId(t.entry); openMigrated = true; });
  if(openMigrated) await persistOpen();
  try{ const sz = await lsGet('journal-sizing'); state.sizingRows = sz ? JSON.parse(sz.value) : []; }catch(e){ state.sizingRows = []; }
  try{ const su = await lsGet('journal-setup-list'); state.setups = su ? JSON.parse(su.value) : [...DEFAULT_SETUPS]; }catch(e){ state.setups = [...DEFAULT_SETUPS]; }
  try{ const sg = await lsGet('journal-strategy-list'); state.strategies = sg ? JSON.parse(sg.value) : [...DEFAULT_STRATEGIES]; }catch(e){ state.strategies = [...DEFAULT_STRATEGIES]; }
  try{ const pb = await lsGet('journal-playbook'); state.playbooks = pb ? JSON.parse(pb.value) : []; }catch(e){ state.playbooks = []; }
  // One-time migration: fold old free-text setup tags into the fixed SETUPS list.
  let setupsMigrated = false;
  state.trades.forEach(t=>{ const n = normalizeSetup(t.setup); if(n !== (t.setup||null)){ t.setup = n; setupsMigrated = true; } });
  state.openTrades.forEach(t=>{ const n = normalizeSetup(t.setup); if(n !== (t.setup||null)){ t.setup = n; setupsMigrated = true; } });
  if(setupsMigrated){ await persistTrades(); await persistOpen(); }
  if(backfillCapitalSnapshots()) await persistTrades();
  if(backfillOpenPositionPosPct()) await persistOpen();
  if(!(await hasKey('journal-trades'))) await persistTrades();
  if(!(await hasKey('journal-open'))) await persistOpen();
  if(!(await hasKey('journal-setup-list'))) await persistSetups();
  if(!(await hasKey('journal-strategy-list'))) await persistStrategies();
  try{ const th = await lsGet('journal-theme'); state.theme = th && (th.value==='light'||th.value==='dark') ? th.value : 'dark'; }catch(e){ state.theme = 'dark'; }
  applyTheme();

  // Capital ledger + Financial Year entities — one-time migration from the old single global
  // Starting Capital, guarded by the presence of 'journal-fy-list' so it only ever runs once.
  const fyListExists = await hasKey('journal-fy-list');
  if(fyListExists){
    try{ const fl = await lsGet('journal-fy-list'); state.financialYears = fl ? JSON.parse(fl.value) : []; }catch(e){ state.financialYears = []; }
    try{ const ct = await lsGet('journal-capital-ledger'); state.capitalTransactions = ct ? JSON.parse(ct.value) : []; }catch(e){ state.capitalTransactions = []; }
  } else {
    const built = buildInitialLedger();
    state.financialYears = built.financialYears;
    state.capitalTransactions = built.capitalTransactions;
    await persistFYList(); await persistCapitalLedger();
  }
  // Safety net: if the app has been open across a real 1 April rollover without the user closing
  // the prior FY, make sure a Financial Year entity + Opening Balance still exist for "today" so the
  // FY picker and Money Management tab always have somewhere valid to point at. This does NOT run
  // Close FY (no P/L Transfer, no automatic sweep) — it only ensures the entity exists.
  if(!getFYEntry(currentFY())){
    const fy = currentFY();
    const openingBalance = capitalAsOf(fyStartDate(fy));
    state.financialYears.push({ fy, startDate: fyStartDate(fy), endDate: fyEndDate(fy), openingBalance, isCurrent:false, isClosed:false, closedAt:null });
    state.capitalTransactions.push({ id: uid(), fy, date: fyStartDate(fy), type:'Opening Balance', amount: openingBalance, notes:`FY${fy} Opening Balance` });
    await persistFYList(); await persistCapitalLedger();
  }
  // One-time fixup for data saved before 'Starting Capital' existed as its own type: the earliest
  // FY's anchor transaction was originally created as 'Opening Balance'. Rename it so the current
  // edit rules (editable while its FY is open, locked after) apply to it correctly.
  {
    const earliestFYCode = state.financialYears.length ? [...state.financialYears].sort((a,b)=>a.fy<b.fy?-1:1)[0].fy : null;
    if(earliestFYCode){
      const anchorTx = state.capitalTransactions.find(t=>t.fy===earliestFYCode && t.type==='Opening Balance');
      if(anchorTx){
        anchorTx.type = 'Starting Capital';
        anchorTx.notes = `FY${earliestFYCode} Starting Capital`;
        await persistCapitalLedger();
      }
    }
  }
  state.selectedFY = getCurrentFYEntry() ? getCurrentFYEntry().fy : currentFY();
}

function analytics(trades, startCap){
  startCap = startCap ?? earliestStartingCapital();
  const n = trades.length;
  const wins = trades.filter(t=>t.pnl>0), losses = trades.filter(t=>t.pnl<0);
  const winRate = n? wins.length/n : null;
  const totalPnl = trades.reduce((a,t)=>a+t.pnl,0);
  const grossWin = wins.reduce((a,t)=>a+t.pnl,0), grossLoss = Math.abs(losses.reduce((a,t)=>a+t.pnl,0));
  const profitFactor = grossLoss? grossWin/grossLoss : null;
  const rVals = trades.filter(t=>t.rrr!=null).map(t=>t.rrr);
  const expectancyR = rVals.length? rVals.reduce((a,b)=>a+b,0)/rVals.length : null;
  const sorted = [...trades].filter(t=>t.exit).sort((a,b)=> new Date(a.exit)-new Date(b.exit));
  let cum = startCap, peak = cum, maxDD = 0, maxDDPct = 0;
  const curve = [{x:'Start', y:cum}];
  sorted.forEach(t=>{
    cum += t.pnl; peak = Math.max(peak,cum);
    const dd = peak-cum, ddPct = peak? dd/peak : 0;
    maxDD = Math.max(maxDD, dd); maxDDPct = Math.max(maxDDPct, ddPct);
    curve.push({x:t.exit, y:cum});
  });
  const winPcts = wins.filter(t=>t.entryValue).map(t=>t.pnl/t.entryValue);
  const lossPcts = losses.filter(t=>t.entryValue).map(t=>t.pnl/t.entryValue);
  const avgWinPct = winPcts.length? winPcts.reduce((a,b)=>a+b,0)/winPcts.length : null;
  const avgLossPct = lossPcts.length? lossPcts.reduce((a,b)=>a+b,0)/lossPcts.length : null;
  let curStreak=0, curType=null, bestWinStreak=0, bestLossStreak=0, run=0, runType=null;
  sorted.forEach(t=>{
    const type = t.pnl>0?'W':(t.pnl<0?'L':null);
    if(type===runType){ run++; } else { run=1; runType=type; }
    if(type==='W') bestWinStreak=Math.max(bestWinStreak,run);
    if(type==='L') bestLossStreak=Math.max(bestLossStreak,run);
  });
  if(sorted.length){
    const last = sorted[sorted.length-1];
    curType = last.pnl>0?'W':(last.pnl<0?'L':null); curStreak=1;
    for(let i=sorted.length-2;i>=0;i--){ const ty=sorted[i].pnl>0?'W':(sorted[i].pnl<0?'L':null); if(ty===curType) curStreak++; else break; }
  }
  const holdVals = trades.filter(t=>t.holdDays!=null).map(t=>t.holdDays);
  const avgHoldDays = holdVals.length? holdVals.reduce((a,b)=>a+b,0)/holdVals.length : null;
  return {n, winRate, totalPnl, profitFactor, expectancyR, curve, maxDD, maxDDPct, curStreak, curType, bestWinStreak, bestLossStreak,
    avgWin: wins.length? grossWin/wins.length:null, avgLoss: losses.length? -grossLoss/losses.length:null, avgWinPct, avgLossPct, avgHoldDays};
}
// Permanently records POS % and Impact on a just-closed trade. Impact always uses Current Capital
// at the moment of closure. POS % only gets computed here as a fallback (for trades logged directly
// without ever being an Open Trade) — when exiting an actual position, its already-stamped POS %
// is copied in before this runs, and that copied value is left untouched. Either way, each field is
// set at most once — never recalculated again — so historical values stay a true point-in-time record.
function stampCapitalSnapshot(trade){
  const c = computeClosed(trade);
  const capitalAtClose = getCurrentCapital(c.fy || currentFY());
  if(trade.posPctAtClose == null) trade.posPctAtClose = capitalAtClose ? c.entryValue/capitalAtClose : null;
  if(trade.pImpactAtClose == null) trade.pImpactAtClose = capitalAtClose ? c.pnl/capitalAtClose : null;
}
// One-time backfill for trades logged before POS %/Impact existed: reconstructs capital
// chronologically (by exit date) so legacy trades get a historically-consistent snapshot instead of
// being blank forever. Once stamped, a trade's values are permanent and this never touches it again.
function backfillCapitalSnapshots(){
  const needsBackfill = state.trades.some(t=>t.posPctAtClose==null || t.pImpactAtClose==null);
  if(!needsBackfill) return false;
  const sorted = [...state.trades].filter(t=>t.exit).sort((a,b)=> new Date(a.exit)-new Date(b.exit) || String(a.id).localeCompare(String(b.id)));
  let capital = state.startingCapital;
  sorted.forEach(t=>{
    const c = computeClosed(t);
    capital += c.pnl;
    if(t.posPctAtClose == null) t.posPctAtClose = capital ? c.entryValue/capital : null;
    if(t.pImpactAtClose == null) t.pImpactAtClose = capital ? c.pnl/capital : null;
  });
  return true;
}
// FY Starting Capital: Current Capital as it stood at the start of the given financial year (1 April),
// derived from Starting Capital plus every trade realized strictly before that date.
function fyStartDate(fy){ if(!fy) return null; const startYear = parseInt(fy.split('-')[0],10); return `${startYear}-04-01`; }
// Reconstructs what Current Capital would have been as of a given date, using only trades that had
// already closed strictly before it. Used both for FY Starting Capital and for backfilling POS % on
// open trades that predate this feature (there's no other record of "capital back then").
function capitalAsOf(dateStr){
  if(!dateStr) return earliestStartingCapital();
  const pnlBefore = state.trades.map(computeClosed).filter(t=>t.exit && t.exit < dateStr).reduce((s,t)=>s+t.pnl,0);
  return earliestStartingCapital() + pnlBefore;
}
function fyStartCapital(fy){
  const start = fyStartDate(fy);
  return start ? capitalAsOf(start) : state.startingCapital;
}
// One-time backfill for open trades logged before POS % existed: reconstructs Capital as of each
// position's entry date so it gets a historically-consistent value instead of staying blank forever.
// Once stamped, a position's POS % only changes again when a new entry (scale-in) is added.
function backfillOpenPositionPosPct(){
  let changed = false;
  state.openTrades.forEach(t=>{
    if(t.posPct == null){
      const capital = t.entryPrice * t.qty;
      const cc = capitalAsOf(t.entry);
      t.posPct = cc ? capital/cc : null;
      changed = true;
    }
  });
  return changed;
}
function monthlyPerformance(trades){
  const allClosed = state.trades.map(computeClosed).filter(t=>t.exit).sort((a,b)=>new Date(a.exit)-new Date(b.exit));
  function capitalAtStart(monthDate){
    const pnlBefore = allClosed.filter(t=>new Date(t.exit) < monthDate).reduce((a,t)=>a+t.pnl,0);
    return earliestStartingCapital() + pnlBefore;
  }
  const map = {};
  trades.forEach(t=>{
    if(!t.exit) return;
    const d = new Date(t.exit); if(isNaN(d)) return;
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!map[key]) map[key] = { key, label: d.toLocaleDateString('en-IN',{month:'short',year:'numeric'}), trades:[], sortDate:new Date(d.getFullYear(),d.getMonth(),1) };
    map[key].trades.push(t);
  });
  return Object.values(map).sort((a,b)=>b.sortDate-a.sortDate).map(m=>{
    const n = m.trades.length;
    const winCount = m.trades.filter(t=>t.pnl>0).length;
    const netPnl = m.trades.reduce((a,t)=>a+t.pnl,0);
    const capStart = capitalAtStart(m.sortDate);
    const pnlPct = capStart>0? netPnl/capStart : null;
    const rVals = m.trades.filter(t=>t.rrr!=null).map(t=>t.rrr);
    const avgR = rVals.length? rVals.reduce((a,b)=>a+b,0)/rVals.length : null;
    const wins = m.trades.filter(t=>t.pnl>0), losses = m.trades.filter(t=>t.pnl<0);
    const grossWin = wins.reduce((a,t)=>a+t.pnl,0), grossLoss = Math.abs(losses.reduce((a,t)=>a+t.pnl,0));
    const profitFactor = grossLoss? grossWin/grossLoss : null;
    return { label:m.label, n, winRate: n? winCount/n:null, netPnl, pnlPct, avgR, profitFactor };
  });
}
function setupStats(trades){
  const map = {};
  trades.forEach(t=>{ const key=t.setup||'Untagged'; if(!map[key]) map[key]={count:0,wins:0,pnl:0,rVals:[]};
    map[key].count++; if(t.pnl>0) map[key].wins++; map[key].pnl+=t.pnl; if(t.rrr!=null) map[key].rVals.push(t.rrr); });
  return Object.entries(map).map(([name,d])=>({ name, count:d.count, winRate:d.wins/d.count, pnl:d.pnl,
    avgR: d.rVals.length? d.rVals.reduce((a,b)=>a+b,0)/d.rVals.length : null })).sort((a,b)=>b.pnl-a.pnl);
}
function rHistogram(trades){
  const buckets = [{label:'<-2R',min:-Infinity,max:-2},{label:'-2 to -1R',min:-2,max:-1},{label:'-1 to 0R',min:-1,max:0},
    {label:'0 to 1R',min:0,max:1},{label:'1 to 2R',min:1,max:2},{label:'2 to 3R',min:2,max:3},{label:'>3R',min:3,max:Infinity}];
  return buckets.map(b=>({ label:b.label, count:trades.filter(t=>t.rrr!=null && t.rrr>=b.min && t.rrr<b.max).length, mid:(b.min+b.max)/2 }));
}

// Re-renders while keeping whatever input/textarea/select was focused (and its
// caret position) focused afterwards. render() replaces the whole #app subtree
// via innerHTML, so a plain render() call always steals focus from an input the
// user is actively typing in; this wrapper is used anywhere that would otherwise happen.
function renderPreserveFocus(){
  const active = document.activeElement;
  const id = active && active.id;
  const tag = active && active.tagName;
  const canSelect = tag==='INPUT' || tag==='TEXTAREA';
  const selStart = canSelect ? active.selectionStart : null;
  const selEnd = canSelect ? active.selectionEnd : null;
  render();
  if(!id) return;
  const el = document.getElementById(id);
  if(!el) return;
  el.focus();
  if(selStart!=null && el.setSelectionRange){
    try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
  }
}

  const a = analytics(filteredClosed, curveStartCap);
  const setups = setupStats(filteredClosed);
  const rBySetupTrades = {};
  filteredClosed.forEach(t=>{ const key=t.setup||'Untagged'; (rBySetupTrades[key]=rBySetupTrades[key]||[]).push(t); });
  const setupRDist = setups
    .filter(s=> (rBySetupTrades[s.name]||[]).some(t=>t.rrr!=null))
    .map(s=>({ name:s.name, avgR:s.avgR, count:rBySetupTrades[s.name].filter(t=>t.rrr!=null).length }))
    .sort((a,b)=> (b.avgR??-Infinity) - (a.avgR??-Infinity));
  const openComputed = getFilteredOpenTrades();
  const openPnl = openComputed.reduce((s,t)=>s+t.absRet,0);
  const currentCapital = getCurrentCapital(state.selectedFY);
  const wcsAmount = currentCapital * state.wcs/100;
  // Capital Protection: Remaining = Capital Protection amount + this view's Net P&L, clamped to [0, wcsAmount].
  let remainingProtection = wcsAmount + a.totalPnl;
  if(remainingProtection > wcsAmount) remainingProtection = wcsAmount;
  if(remainingProtection < 0) remainingProtection = 0;
  const remainingProtectionPct = wcsAmount ? (remainingProtection/wcsAmount*100) : null;

  // Risk per Trade: violations = trades whose actual risk (Init SL distance × Qty ÷ capital at
  // entry) exceeded the configured Risk Limit. Hard Limit is Risk Limit + 1 percentage point.

  const violatingTrades = riskedTrades.filter(t=>t.riskPctOfCapital>riskLimit).sort((a,b)=>b.riskPctOfCapital-a.riskPctOfCapital);
  const violations = violatingTrades.length;
  const highestRisk = riskedTrades.length ? Math.max(...riskedTrades.map(t=>t.riskPctOfCapital)) : 0;

    const fy = state.selectedFY || currentFY();

    <div class="stat"><div class="lbl">Max Drawdown</div><div class="val neg">${fmtMoney(-a.maxDD)}</div><div class="sub-val neg">${fmtPct(a.maxDDPct)}</div></div>

  </div>
  <div class="hero">
    <div class="hero-head"><h2>Edge Distribution (R)</h2><span class="tag">${fyTag} · ${strategyTag} · win rate tells you how often, this tells you if it's worth it</span></div>
    <div class="hist-wrap" id="histChart"></div>
  </div>
  <div class="panel" style="margin-bottom:20px">
    <h3>R-Multiple by Setup <small>${fyTag} · ${strategyTag} · P&amp;L tells you what happened, this tells you if it's repeatable</small></h3>
    <div class="hist-wrap">${setupRDist.length? svgSetupRHistogram(setupRDist) : '<p class="empty" style="padding:20px 0">No trades with a logged Init SL yet — R-Multiple needs an Init SL to calculate.</p>'}</div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>Equity Curve <small>starting capital ${fmtMoney(curveStartCap)}</small></h3>
      <div class="chart-wrap" id="equityChart"></div></div>
    <div class="panel"><h3>Performance by Setup <small>${setups.length} tagged</small></h3>
      ${setups.length? setups.map(s=>{ const maxAbs=Math.max(...setups.map(x=>Math.abs(x.pnl)),1);
        return `<div class="setup-row"><div class="setup-name">${s.name}</div><div class="setup-count">${s.count}×</div>

  <div class="panel" style="margin-bottom:20px"><h3>Discipline Check</h3>
    <div class="discipline-row"><div class="setup-name">Avg Holding</div><div class="discipline-context"></div><div style="text-align:right">${a.avgHoldDays!=null?a.avgHoldDays.toFixed(1)+'d':'—'}</div></div>

    <div class="discipline-row"><div class="setup-name">Average Loss</div><div class="discipline-context"></div><div class="neg" style="text-align:right">${fmtMoney(a.avgLoss)} <span style="color:var(--muted2);font-size:11px">(${fmtPct(a.avgLossPct)})</span></div></div>
    <div class="discipline-row"><div class="setup-name">Max Drawdown</div><div class="discipline-context"></div><div class="neg" style="text-align:right">${fmtMoney(-a.maxDD)} <span style="color:var(--muted2);font-size:11px">(${fmtPct(a.maxDDPct)})</span></div></div>

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function svgEquityCurve(curve){
  const W=680,H=220,padL=54,padR=14,padT=14,padB=26;
  const border=cssVar('--border'), muted=cssVar('--muted'), teal=cssVar('--teal');
  const ys = curve.map(p=>p.y);
  let yMin=Math.min(...ys), yMax=Math.max(...ys);
  if(yMin===yMax){ yMin-=100; yMax+=100; }
  const span=yMax-yMin, pad=span*0.08;
  yMin-=pad; yMax+=pad;
  const n=curve.length;
  const x = i=> n<=1 ? padL : padL + (i/(n-1))*(W-padL-padR);
  const y = v=> padT + (1-(v-yMin)/(yMax-yMin))*(H-padT-padB);
  const pts = curve.map((p,i)=>`${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
  const areaPts = `${padL},${(H-padB).toFixed(1)} ${pts} ${x(n-1).toFixed(1)},${(H-padB).toFixed(1)}`;
  const gridLines=[0,0.25,0.5,0.75,1].map(f=>{
    const v = yMin+f*(yMax-yMin), yy=y(v);
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="${border}" stroke-width="1"/>
      <text x="${padL-8}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-family="JetBrains Mono" font-size="10" fill="${muted}">${((v)/1000).toFixed(0)+'k'}</text>`;
  }).join('');
  const xLabels=[0, Math.floor((n-1)/2), n-1].filter((v,i,a2)=>a2.indexOf(v)===i).map(i=>{
    const label = curve[i].x==='Start'?'Start':fmtDate(curve[i].x);
    return `<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="${muted}">${label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    ${gridLines}
    <polygon points="${areaPts}" fill="rgba(32,214,168,0.12)"/>
    <polyline points="${pts}" fill="none" stroke="${teal}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${xLabels}
  </svg>`;
}

// Compact version of the same R-bucket shape, sized for one table row — no axis labels or counts,
// just the silhouette, scaled to that row's own max so a setup with 3 trades and one with 30 both
// show a readable shape rather than the smaller one vanishing next to the larger one's scale.
// One bar per setup (diverging from a zero line), same visual language as the main Edge
// Distribution histogram: a value label at the bar's outer tip, and the category (setup name +
// trade count) below. Color follows sign, not the R-bucket convention used in the main chart.
function svgSetupRHistogram(setupRDist){
  const W=680,H=190,padL=14,padR=14,padT=24,padB=34;
  const border=cssVar('--border'), muted2=cssVar('--muted2'), teal=cssVar('--teal'), red=cssVar('--red');
  const n = setupRDist.length;
  const gap = 16;
  const bw = (W-padL-padR-gap*(n-1))/Math.max(n,1);
  const maxAbs = Math.max(...setupRDist.map(s=>Math.abs(s.avgR||0)), 0.1);
  const zeroY = padT + (H-padT-padB)/2;
  const halfH = (H-padT-padB)/2 - 14;
  const bars = setupRDist.map((s,i)=>{
    const bx = padL + i*(bw+gap);
    const val = s.avgR||0;
    const barH = Math.max(Math.abs(val)/maxAbs*halfH, val!==0?2:0);
    const color = val>=0 ? teal : red;
    const by = val>=0 ? zeroY-barH : zeroY;
    const valueLabelY = val>=0 ? by-6 : by+barH+13;
    return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${color}"/>
      <text x="${(bx+bw/2).toFixed(1)}" y="${valueLabelY.toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono" font-size="11" font-weight="600" fill="${color}">${fmtR(val)}</text>
      <text x="${(bx+bw/2).toFixed(1)}" y="${H-18}" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" fill="${muted2}">${s.name}</text>
      <text x="${(bx+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-family="JetBrains Mono" font-size="8.5" fill="${muted2}">${s.count}×</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="${border}" stroke-width="1"/>
    ${bars}
  </svg>`;
}
function svgHistogram(hist){
  const W=680,H=170,padL=14,padR=14,padT=14,padB=26;
  const border=cssVar('--border'), muted2=cssVar('--muted2'), teal=cssVar('--teal'), red=cssVar('--red');
  const maxC = Math.max(...hist.map(h=>h.count),1);
  const n=hist.length, gap=10;
  const bw = (W-padL-padR-gap*(n-1))/n;
  const y = c => padT + (1-c/maxC)*(H-padT-padB);
  const bars = hist.map((h,i)=>{
    const bx = padL + i*(bw+gap);
    const by = y(h.count), bh = (H-padB)-by;
    const color = h.mid<0 ? red : teal;
    return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,0).toFixed(1)}" rx="3" fill="${color}"/>
      ${h.count>0?`<text x="${(bx+bw/2).toFixed(1)}" y="${(by-5).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="${muted2}">${h.count}</text>`:''}
      <text x="${(bx+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" fill="${muted2}">${h.label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="${border}" stroke-width="1"/>
    ${bars}
  </svg>`;
}

  const btn = document.getElementById('btnRefreshCmp');

  for(const sym of symbols){

// Orders Booked Trades rows newest-activity-first overall, while keeping every exit that shares a
// Pos ID clustered together (in chronological order) so a position's full lifecycle reads as one block.
function orderTradeLogRows(trades){
  const groups = {};
  trades.forEach(t=>{ const key = t.posId || ('__solo_'+t.id); (groups[key] = groups[key]||[]).push(t); });
  const blocks = Object.values(groups).map(items=>{
    const sorted = [...items].sort((a,b)=>new Date(a.exit||0)-new Date(b.exit||0));
    const anchor = Math.max(...items.map(t=>new Date(t.exit||0).getTime()||0));
    return { items: sorted, anchor };
  });
  blocks.sort((a,b)=>b.anchor-a.anchor);
  return blocks.flatMap(b=>b.items.map((t,i)=>({...t, __exitIdx:i+1, __exitCount:b.items.length})));
}

    const fy = getCurrentFYEntry().fy;
    if(type==='Starting Capital'){
      state.capitalTransactions.push({ id: uid(), fy, date, type, amount: Math.abs(amount), notes });
      const fyEntry = getFYEntry(fy);
      if(fyEntry) fyEntry.openingBalance = Math.abs(amount);
      await persistFYList();
    } else {
      state.capitalTransactions.push({ id: uid(), fy, date, type, drCr, amount: Math.abs(amount), notes });
    }
    await persistCapitalLedger();
    closeModal(); render();
  };
}

// Builds the new ledger/FY state entirely in local variables, persists it in a single pair of
// writes, and only mutates `state` after both succeed — the closest this key/value store can get
// to an atomic transaction. If either write fails, nothing in `state` changes.
async function performCloseFY(fy, netPL){
  const curEntry = getFYEntry(fy);
  if(!curEntry || !curEntry.isCurrent){ alert('Only the current Financial Year can be closed.'); return; }
  if(state.capitalTransactions.some(t=>t.fy===fy && t.type==='P/L Transfer')){
    alert('This Financial Year has already been closed.'); closeModal(); render(); return;
  }
  const newFYCode = nextFYCode(fy);
  if(state.financialYears.some(f=>f.fy===newFYCode)){
    alert(`Financial Year ${newFYCode} already exists — cannot close again.`); closeModal(); render(); return;
  }
  const balanceBeforeTransfer = capitalBalance(fy);
  const transferTx = { id: uid(), fy, date: fyEndDate(fy), type:'P/L Transfer', amount: netPL, notes:`FY${fy} Net P/L` };
  const newOpeningBalance = balanceBeforeTransfer + netPL;
  const newFYEntry = { fy: newFYCode, startDate: fyStartDate(newFYCode), endDate: fyEndDate(newFYCode),
    openingBalance: newOpeningBalance, isCurrent:true, isClosed:false, closedAt:null };
  const openingTx = { id: uid(), fy:newFYCode, date:newFYEntry.startDate, type:'Opening Balance', amount:newOpeningBalance, notes:`FY${newFYCode} Opening Balance` };

  const newTransactions = [...state.capitalTransactions, transferTx, openingTx];
  const newFYList = state.financialYears.map(f=> f.fy===fy ? {...f, isCurrent:false, isClosed:true, closedAt:new Date().toISOString()} : f).concat([newFYEntry]);

  try{
    await lsSet('journal-capital-ledger', JSON.stringify(newTransactions));
    await lsSet('journal-fy-list', JSON.stringify(newFYList));
  }catch(e){
    alert('Failed to close the Financial Year — no changes were made. ' + (e && e.message ? e.message : '')); return;
  }
  state.capitalTransactions = newTransactions;
  state.financialYears = newFYList;
  state.selectedFY = newFYCode;
  closeModal();
  render();
}

// ---- Simplified Export dialog: Report Type x Period ---------------------------------------
function resolvePeriodRange(period, customStart, customEnd){
  const curFy = (getCurrentFYEntry()||{}).fy || currentFY();
  if(period==='current') return { start: fyStartDate(curFy), end: fyEndDate(curFy), tag: `FY${curFy}` };
  if(period==='previous'){ const p = prevFYCode(curFy); return { start: fyStartDate(p), end: fyEndDate(p), tag: `FY${p}` }; }
  if(period==='custom') return { start: customStart, end: customEnd, tag: `${customStart}_to_${customEnd}` };
  return { start: null, end: null, tag: 'AllTime' }; // all time
}
function inRange(dateStr, range){
  if(!dateStr) return false;
  if(range.start && dateStr < range.start) return false;
  if(range.end && dateStr > range.end) return false;
  return true;
}
function tradeLogData(range){
  return state.trades.map(computeClosed).filter(t=>inRange(t.exit, range))
    .sort((a,b)=>new Date(a.exit||0)-new Date(b.exit||0))
    .map(t=>({ Symbol:t.symbol, Side:t.side, 'Entry Date':t.entry, 'Exit Date':t.exit,
      'Entry Price':t.entryPrice, 'Exit Price':t.exitPrice, Qty:t.qty,
      'Net P/L':Math.round(t.pnl*100)/100, 'P/L %': t.pctReturn!=null? +(t.pctReturn*100).toFixed(2) : '', 'R-Mult': t.rrr!=null? +t.rrr.toFixed(2) : '',
      'Impact': t.pImpactAtClose!=null? +(t.pImpactAtClose*100).toFixed(2) : '', 'Hold (days)': t.holdDays??'',
      Strategy: t.strategy||'Not Assigned', 'Setup': t.setup||'', Notes: t.remarks||'' }));
}
function openPositionsData(range){
  return state.openTrades.map(computeOpen).filter(t=> !range.start ? true : inRange(t.entry, range))
    .sort((a,b)=>new Date(a.entry||0)-new Date(b.entry||0))
    .map(t=>({ 'Position ID':t.posId||'', Symbol:t.symbol, Side:t.side, 'Entry Date':t.entry, 'Entry Price':t.entryPrice, Qty:t.qty,
      'Invested':Math.round(t.capital*100)/100, 'Init SL':t.initSL??'', 'Trailed SL':t.trailedSL??'', 'CMP':t.cmp,
      'Unrealized P/L':Math.round(t.absRet*100)/100, 'POS %': t.posPct!=null? +(t.posPct*100).toFixed(2):'',
      Strategy:t.strategy||'Not Assigned', 'Setup':t.setup||'' }));
}
function capitalTransactionsData(range){
  const fys = [...new Set(state.capitalTransactions.map(t=>t.fy))].sort();
  const rows = [];
  fys.forEach(fy=> rows.push(...capitalTransactionsWithBalance(fy)));
  return rows.filter(t=>inRange(t.date, range))
    .map(t=>{ const delta = txDelta(t); return { Date:t.date, 'Financial Year':t.fy, Type:t.type,
      'Dr Amount': delta<0? Math.round(Math.abs(delta)*100)/100 : '',
      'Cr Amount': delta>0? Math.round(delta*100)/100 : '',
      Balance: Math.round(t.balance*100)/100, Notes: t.notes||'' }; });
}

function renderHowToTab(){
